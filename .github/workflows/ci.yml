name: DhanSetu AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test demo-data migration
        run: npm run test:migration

      - name: Test PWA install assets
        run: npm run test:pwa

      - name: Test budget alert persistence
        run: npm run test:alerts

      - name: Lint production-facing app surfaces
        run: npm run lint:ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend/backend
        run: npm ci

      - name: Check backend syntax
        run: |
          node --check backend/backend/server.js
          node --check backend/backend/models/Transaction.js
          node --check backend/backend/routes/ai.js
          node --check backend/backend/routes/auth.js
          node --check backend/backend/routes/auth-demo.js
          node --check backend/backend/routes/transactions.js
          node --check backend/backend/routes/transactions-demo.js
          node --check backend/backend/routes/user.js
          node --check backend/backend/routes/user-demo.js
          node --check backend/backend/scripts/smoke-test.js
          node --check backend/backend/test-server.js

      - name: Run Jest integration tests
        working-directory: backend/backend
        run: npm test -- --coverage=false

      - name: Start backend in demo mode
        working-directory: backend/backend
        run: |
          nohup npm start > /tmp/dhansetu-backend.log 2>&1 &
          echo $! > /tmp/dhansetu-backend.pid

      - name: Wait for backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dhansetu-backend.log
          exit 1

      - name: Run backend demo smoke test
        working-directory: backend/backend
        run: npm run smoke

      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/dhansetu-backend.log

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      FRONTEND_URL: http://localhost:8080
      PRODUCTION_URL: http://localhost:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production backend image
        run: docker build --file backend/backend/Dockerfile --tag dhansetu-backend:ci ./backend/backend

      - name: Build production frontend image
        run: docker build --file Dockerfile --tag dhansetu-frontend:ci --build-arg VITE_API_URL=/api --build-arg VITE_SOCKET_URL= .

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check
